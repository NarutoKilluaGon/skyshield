name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest # ships /usr/bin/google-chrome for flows/shots
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (ESLint flat config, jsx-a11y + react-hooks)
        run: npm run lint

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test:unit

      - name: Build (production bundle)
        run: npm run build

      - name: Bundle-size gate
        run: npm run size-gate

      - name: Serve the production build
        run: nohup npm run preview -- --port 5173 --strictPort > /tmp/preview.log 2>&1 &

      - name: Wait for the server
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:5173/ > /dev/null; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "preview server did not start:" && cat /tmp/preview.log && exit 1

      - name: DOM smoke suite (jsdom, real route table)
        run: npm run smoke

      - name: Interactive flows (headless Chrome over CDP)
        run: npm run flows

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r backend/requirements.txt

      - name: Django tests (workflow guards, auth, data API)
        run: cd backend && python manage.py test

  api-flows:
    runs-on: ubuntu-latest # ships /usr/bin/google-chrome for flows
    needs: [verify, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install (node)
        run: npm ci

      - name: Install (python)
        run: pip install -r backend/requirements.txt

      - name: Interactive flows against the real API (VITE_USE_MOCK=false)
        run: npm run api:flows
